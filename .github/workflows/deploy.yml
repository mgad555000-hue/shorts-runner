name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 92.112.192.142
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/mg-ranner
            git fetch origin master
            git reset --hard origin/master
            # إعادة بناء صورة الـ sandbox عشان كود الوصفات الجديد (engine/recipe_runner) يتحدّث
            docker build -f sandbox.Dockerfile -t shorts-runner-sandbox .
            docker compose -f docker-compose.vps.yml restart shorts-app
            echo "Deploy done at $(date)"
